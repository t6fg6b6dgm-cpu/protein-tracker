<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蛋白質記錄">
<title>每日蛋白質記錄</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Helvetica Neue", sans-serif;
    background: #fdf6ec;
    color: #3a2b1a;
    padding-bottom: 110px;
  }
  header {
    background: linear-gradient(180deg, #f5d98f, #eec870);
    text-align: center;
    padding: 16px 10px 12px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
  }
  header h1 span {
    color: #d9480f;
    font-size: 26px;
  }
  .container {
    padding: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fdf8ee;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  thead th {
    background: #6b4226;
    color: #fff;
    font-size: 14px;
    padding: 8px 4px;
    text-align: center;
  }
  tbody td {
    padding: 8px 4px;
    text-align: center;
    font-size: 14px;
    border-bottom: 1px solid #eee0c8;
  }
  tbody tr:nth-child(even) {
    background: #fbf1da;
  }
  .food-name {
    text-align: left !important;
    padding-left: 8px !important;
    font-weight: 600;
    font-size: 14px;
  }
  input[type="number"] {
    width: 56px;
    padding: 6px 2px;
    font-size: 15px;
    text-align: center;
    border: 1px solid #c9a86c;
    border-radius: 6px;
    background: #fff;
  }
  .protein-result {
    font-weight: 700;
    color: #d9480f;
  }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #ffe9a6;
    border-top: 2px solid #e0b24d;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 -3px 8px rgba(0,0,0,0.15);
  }
  .footer-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  footer .label {
    font-size: 16px;
    font-weight: 700;
  }
  footer .total {
    font-size: 22px;
    font-weight: 800;
  }
  .total.incomplete {
    color: #c92a2a;
  }
  .total.complete {
    color: #2b8a3e;
  }
  .status {
    text-align: right;
    font-size: 16px;
    font-weight: 800;
  }
  .status.incomplete {
    color: #c92a2a;
  }
  .status.complete {
    color: #2b8a3e;
  }
  .reset-btn {
    display: block;
    margin: 12px auto 4px;
    padding: 8px 18px;
    background: #a65d2e;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <h1>每日攝取最少 <span>8</span> 份蛋白質</h1>
</header>

<div class="container">
  <table>
    <thead>
      <tr>
        <th>食物</th>
        <th>份量</th>
        <th>蛋白質<br>含量</th>
        <th>攝取量</th>
        <th>蛋白質<br>攝取</th>
      </tr>
    </thead>
    <tbody id="foodTableBody">
      <!-- rows injected by JS -->
    </tbody>
  </table>

  <button class="reset-btn" onclick="resetAll()">重設所有數值</button>
</div>

<footer>
  <div class="footer-top">
    <span class="label">總蛋白質攝取：</span>
    <span class="total" id="totalDisplay">0 份</span>
  </div>
  <div class="status" id="statusDisplay"></div>
</footer>

<script>
  const foods = [
    { name: "雀巢 速癒素",        portion: "1枝",     protein: 3 },
    { name: "莓味 能全素",        portion: "1枝",     protein: 2.5 },
    { name: "雞蛋",               portion: "1隻",     protein: 1 },
    { name: "大雞胸 / 大雞髀肉",   portion: "1隻",     protein: 3 },
    { name: "生免治肉",           portion: "45克",    protein: 1 },
    { name: "生魚肉",             portion: "45克",    protein: 1 },
    { name: "生帶子 / 生中蝦",     portion: "4隻",     protein: 1 },
    { name: "海參",               portion: "1件",     protein: 1.5 },
    { name: "牛奶",               portion: "210毫升", protein: 1 }
  ];

  const STORAGE_KEY = "proteinTrackerData";
  const DAILY_TARGET = 8;

  function fmt(num) {
    return (Number.isInteger(num)) ? num.toString() : num.toFixed(1);
  }

  function loadSavedValues() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return saved || {};
    } catch (e) {
      return {};
    }
  }

  function saveValues() {
    const data = {};
    foods.forEach((f, i) => {
      const val = parseFloat(document.getElementById('input-' + i).value) || 0;
      data[i] = val;
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function renderTable() {
    const saved = loadSavedValues();
    const tbody = document.getElementById('foodTableBody');
    tbody.innerHTML = "";

    foods.forEach((food, i) => {
      const savedVal = saved[i] || 0;
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="food-name">${food.name}</td>
        <td>${food.portion}</td>
        <td>${fmt(food.protein)}份</td>
        <td><input type="number" id="input-${i}" inputmode="decimal" min="0" step="0.5" value="${savedVal || ''}" placeholder="0" oninput="updateRow(${i})"></td>
        <td class="protein-result" id="result-${i}">${fmt(food.protein * savedVal)}</td>
      `;
      tbody.appendChild(row);
    });
    updateTotal();
  }

  function updateRow(i) {
    const inputVal = parseFloat(document.getElementById('input-' + i).value) || 0;
    const result = foods[i].protein * inputVal;
    document.getElementById('result-' + i).textContent = fmt(result);
    saveValues();
    updateTotal();
  }

  function updateTotal() {
    let total = 0;
    foods.forEach((food, i) => {
      const val = parseFloat(document.getElementById('input-' + i).value) || 0;
      total += food.protein * val;
    });

    const totalDisplay = document.getElementById('totalDisplay');
    const statusDisplay = document.getElementById('statusDisplay');

    totalDisplay.textContent = fmt(total) + " 份";

    if (total < DAILY_TARGET) {
      const remaining = DAILY_TARGET - total;
      totalDisplay.classList.remove('complete');
      totalDisplay.classList.add('incomplete');
      statusDisplay.classList.remove('complete');
      statusDisplay.classList.add('incomplete');
      statusDisplay.textContent = `尚欠 ${fmt(remaining)} 份💪🏻`;
    } else {
      totalDisplay.classList.remove('incomplete');
      totalDisplay.classList.add('complete');
      statusDisplay.classList.remove('incomplete');
      statusDisplay.classList.add('complete');
      statusDisplay.textContent = "🎉成功!! 🎉";
    }
  }

  function resetAll() {
    localStorage.removeItem(STORAGE_KEY);
    renderTable();
  }

  renderTable();
</script>

</body>
</html>
