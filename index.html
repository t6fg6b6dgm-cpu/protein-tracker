<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蛋白質記錄">
<title>每日蛋白質記錄</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Helvetica Neue", sans-serif;
    background: #fdf6ec;
    color: #3a2b1a;
    padding-bottom: calc(150px + env(safe-area-inset-bottom));
  }
  header {
    background: linear-gradient(180deg, #f5d98f, #eec870);
    text-align: center;
    padding: 18px 10px 14px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
  }
  header h1 span {
    color: #d9480f;
    font-size: 30px;
  }
  .container {
    padding: 14px;
  }

  /* Food cards */
  .food-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 18px;
  }
  .food-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #fdf8ee;
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .food-info {
    flex: 1 1 auto;
    min-width: 0;
  }
  .food-name {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.35;
  }
  .food-meta {
    font-size: 14px;
    color: #8a6d3b;
    margin-top: 3px;
  }

  /* Stepper */
  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .step-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #a65d2e;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .step-btn.plus {
    background: #d9480f;
  }
  .step-btn:disabled {
    opacity: 0.35;
  }
  .step-btn:active {
    transform: scale(0.92);
  }
  .step-value {
    min-width: 36px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: #3a2b1a;
  }

  .protein-result {
    font-size: 17px;
    font-weight: 800;
    color: #d9480f;
    min-width: 58px;
    text-align: right;
    flex-shrink: 0;
  }

  .reset-btn {
    display: block;
    margin: 16px auto 4px;
    padding: 10px 22px;
    background: #a65d2e;
    color: #fff;
    border: none;
    border-radius: 22px;
    font-size: 16px;
    font-weight: 700;
  }
  .reset-btn:active {
    transform: scale(0.96);
  }

  /* Footer with progress bar */
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #ffe9a6;
    border-top: 2px solid #e0b24d;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom)) 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 -3px 8px rgba(0,0,0,0.15);
  }
  .progress-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .progress-label .label-text {
    font-size: clamp(15px, 4vw, 19px);
    font-weight: 700;
  }
  .progress-label .total-text {
    font-size: clamp(21px, 6vw, 28px);
    font-weight: 800;
  }
  .progress-container {
    width: 100%;
    height: 18px;
    background: #f3e5c3;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e0b24d;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 12px;
    transition: width 0.35s ease, background 0.35s ease;
  }
  .progress-bar.incomplete {
    background: linear-gradient(90deg, #ff8787, #e8590c);
  }
  .progress-bar.complete {
    background: linear-gradient(90deg, #69db7c, #2b8a3e);
  }
  .status {
    text-align: center;
    font-size: clamp(17px, 4.8vw, 21px);
    font-weight: 800;
  }
  .status.incomplete {
    color: #c92a2a;
  }
  .status.complete {
    color: #2b8a3e;
  }
</style>
</head>
<body>

<header>
  <h1>每日攝取最少 <span>8</span> 份蛋白質</h1>
</header>

<div class="container">
  <div class="food-list" id="foodTableBody">
    <!-- rows injected by JS -->
  </div>

  <button class="reset-btn" onclick="resetAll()">重設所有數值</button>
</div>

<footer>
  <div class="progress-wrap">
    <div class="progress-label">
      <span class="label-text">總蛋白質攝取</span>
      <span class="total-text" id="totalDisplay">0 / 8 份</span>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
  <div class="status" id="statusDisplay"></div>
</footer>

<script>
  const foods = [
    { name: "雀巢 速癒素🍼",        portion: "1枝",     protein: 3 },
    { name: "莓味 能全素🍓",        portion: "1枝",     protein: 2.5 },
    { name: "雞蛋🐣",               portion: "1隻",     protein: 1 },
    { name: "大雞胸 / 大雞髀肉🍗",   portion: "0.5隻",     protein: 1.5 },
    { name: "生免治肉🥩",           portion: "45克",    protein: 1 },
    { name: "生魚肉🐟",             portion: "45克",    protein: 1 },
    { name: "生帶子 / 生中蝦🦐",     portion: "1隻",     protein: 0.25 },
    { name: "海參🪶",               portion: "1件",     protein: 1.5 },
    { name: "牛奶🥛",               portion: "210毫升", protein: 1 }
  ];

  const STORAGE_KEY = "proteinTrackerData";
  const DAILY_TARGET = 8;

  function fmt(num) {
    return (Number.isInteger(num)) ? num.toString() : num.toFixed(1);
  }

  function loadSavedValues() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return saved || {};
    } catch (e) {
      return {};
    }
  }

  function saveValues() {
    const data = {};
    foods.forEach((f, i) => {
      const val = parseFloat(document.getElementById('value-' + i).dataset.val) || 0;
      data[i] = val;
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function renderTable() {
    const saved = loadSavedValues();
    const list = document.getElementById('foodTableBody');
    list.innerHTML = "";

    foods.forEach((food, i) => {
      const savedVal = saved[i] || 0;
      const row = document.createElement('div');
      row.className = 'food-row';
      row.innerHTML = `
        <div class="food-info">
          <div class="food-name">${food.name}</div>
          <div class="food-meta">${food.portion}　${fmt(food.protein)}份蛋白質</div>
        </div>
        <div class="stepper">
          <button class="step-btn minus" id="minus-${i}" onclick="changeValue(${i}, -0.5)" ${savedVal <= 0 ? 'disabled' : ''}>−</button>
          <span class="step-value" id="value-${i}" data-val="${savedVal}">${fmt(savedVal)}</span>
          <button class="step-btn plus" onclick="changeValue(${i}, 0.5)">+</button>
        </div>
        <div class="protein-result" id="result-${i}">${fmt(food.protein * savedVal)} 份</div>
      `;
      list.appendChild(row);
    });
    updateTotal();
  }

  function changeValue(i, delta) {
    const valueSpan = document.getElementById('value-' + i);
    let val = parseFloat(valueSpan.dataset.val) || 0;
    val = Math.max(0, Math.round((val + delta) * 2) / 2);
    valueSpan.dataset.val = val;
    valueSpan.textContent = fmt(val);

    const result = foods[i].protein * val;
    document.getElementById('result-' + i).textContent = fmt(result) + ' 份';

    document.getElementById('minus-' + i).disabled = val <= 0;

    saveValues();
    updateTotal();
  }

  function updateTotal() {
    let total = 0;
    foods.forEach((food, i) => {
      const val = parseFloat(document.getElementById('value-' + i).dataset.val) || 0;
      total += food.protein * val;
    });

    const totalDisplay = document.getElementById('totalDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const progressBar = document.getElementById('progressBar');

    const percent = Math.min((total / DAILY_TARGET) * 100, 100);
    progressBar.style.width = percent + '%';

    totalDisplay.textContent = `${fmt(total)} / ${DAILY_TARGET} 份`;

    if (total < DAILY_TARGET) {
      const remaining = DAILY_TARGET - total;
      progressBar.classList.remove('complete');
      progressBar.classList.add('incomplete');
      statusDisplay.classList.remove('complete');
      statusDisplay.classList.add('incomplete');
      statusDisplay.textContent = `尚欠 ${fmt(remaining)} 份`;
    } else {
      progressBar.classList.remove('incomplete');
      progressBar.classList.add('complete');
      statusDisplay.classList.remove('incomplete');
      statusDisplay.classList.add('complete');
      statusDisplay.textContent = "🎉🎉🎉 成功!!! 🎉🎉";
    }
  }

  function resetAll() {
    if (confirm("確定要重設所有數值嗎？")) {
      localStorage.removeItem(STORAGE_KEY);
      renderTable();
    }
  }

  renderTable();
</script>

</body>
</html>
